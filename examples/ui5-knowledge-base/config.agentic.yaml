name: ui5-knowledge-base-agentic

# --- Plugin eval ------------------------------------------------------------
plugin_evals_dir: "evals"

# --- The skill under test ---------------------------------------------------
skill_base_dir: "../../../repos/webcomponents/ai-knowledge-base"
skill_files:
  - "INDEX.md"
  - "SKILL.md"
  - "references/*.md"

# --- Prompts ----------------------------------------------------------------
skill_preamble: "The following SKILL defines mandatory conventions for this repo. Follow it strictly:\n\n"

# --- Execution --------------------------------------------------------------
repo_root: "../../../repos/webcomponents"
backend: claude-cli
agent_skip_permissions: true

# --- Post-checks (run after each plugin eval case) --------------------------
post_checks:
  - name: lint
    command: ["yarn", "lint"]
    cwd: "."
    timeout: 300
