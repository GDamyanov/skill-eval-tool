schema_version: "1.0"
name: skill-fires-on-cypress-request

context:
  scaffold_script: scaffold.sh

execution:
  max_turns: 10
  timeout_seconds: 900
  allowed_tools: [Skill, Read, Glob, Grep, Write, Agent]
  prompt: |
    Write a Cypress component test for the ui5-button component that verifies clicking the button fires a click event. Show the complete test code in your response.

graders:
  - name: criteria
    type: llm
    criteria: |
      PASS if the response contains Cypress test code (e.g. cy.mount, cy.get, it(), describe()).
      FAIL if the response contains no Cypress test code or is only a prose explanation.
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?cypress-test-writer"'
