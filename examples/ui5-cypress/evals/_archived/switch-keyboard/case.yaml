schema_version: "1.0"
name: switch-keyboard

context:
  scaffold_script: scaffold.sh

execution:
  max_turns: 10
  timeout_seconds: 900
  allowed_tools: [Skill, Read, Glob, Grep, Write, Agent]
  prompt: |
    Write a Cypress component test for ui5-switch that verifies toggling with the keyboard after focusing the switch changes the checked state and fires a change event.

graders:
  - name: criteria
    type: llm
    criteria: |
      PASS if the generated Cypress test focuses the switch, toggles it with a keyboard interaction (e.g. Space or Enter), then asserts the checked state changed and a change event fired.
      FAIL if the test uses mouse click instead of keyboard to toggle, or does not assert both state change and event, or if no Cypress test code is present.
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?cypress-test-writer"'
