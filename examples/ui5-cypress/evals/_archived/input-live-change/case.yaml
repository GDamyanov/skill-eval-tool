schema_version: "1.0"
name: input-live-change

context:
  scaffold_script: scaffold.sh

execution:
  max_turns: 10
  timeout_seconds: 900
  allowed_tools: [Skill, Read, Glob, Grep, Write, Agent]
  prompt: |
    Write a Cypress component test for ui5-input that verifies the input event fires on each keystroke when the user types, and that the value property reflects the typed text.

graders:
  - name: criteria
    type: llm
    criteria: |
      PASS if the generated Cypress test types into the input, asserts the input event fires per keystroke, and asserts the value property reflects the typed text.
      FAIL if event firing or value reflection is not tested, or if no Cypress test code is present.
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?cypress-test-writer"'
