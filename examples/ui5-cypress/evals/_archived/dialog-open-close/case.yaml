schema_version: "1.0"
name: dialog-open-close

context:
  scaffold_script: scaffold.sh

execution:
  max_turns: 10
  timeout_seconds: 900
  allowed_tools: [Skill, Read, Glob, Grep, Write, Agent]
  prompt: |
    Write a Cypress component test for ui5-dialog that opens the dialog, asserts it is visible, then closes it and asserts the close event was fired.

graders:
  - name: criteria
    type: llm
    criteria: |
      PASS if the generated Cypress test opens the dialog, asserts it is visible, closes it, and asserts the close event was fired.
      FAIL if open/visible assertion or close event assertion is missing, or if no Cypress test code is present.
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?cypress-test-writer"'
