schema_version: "1.0"
name: checkbox-toggle

context:
  scaffold_script: scaffold.sh

execution:
  max_turns: 10
  timeout_seconds: 900
  allowed_tools: [Skill, Read, Glob, Grep, Write, Agent]
  prompt: |
    Write a Cypress component test for ui5-checkbox that verifies clicking toggles the checked state and fires a change event, and that a disabled checkbox cannot be toggled.

graders:
  - name: criteria
    type: llm
    criteria: |
      PASS if the generated Cypress test verifies toggling an enabled checkbox changes state and fires a change event, and that a disabled checkbox cannot be toggled.
      FAIL if only one of the two cases (enabled or disabled) is tested, or if no Cypress test code is present.
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?cypress-test-writer"'
