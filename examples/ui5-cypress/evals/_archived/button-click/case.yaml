schema_version: "1.0"
name: button-click

context:
  scaffold_script: scaffold.sh

execution:
  max_turns: 10
  timeout_seconds: 900
  allowed_tools: [Skill, Read, Glob, Grep, Write, Agent]
  prompt: |
    Write a Cypress component test for ui5-button that verifies a click event is fired when the button is activated, and that a disabled button does not fire the event.

graders:
  - name: criteria
    type: llm
    criteria: |
      PASS if the generated Cypress test verifies that an enabled button fires a click event and that a disabled button does not fire the event.
      FAIL if only one of the two cases (enabled or disabled) is tested, or if no Cypress test code is present.
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?cypress-test-writer"'
