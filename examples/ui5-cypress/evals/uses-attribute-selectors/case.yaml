schema_version: "1.0"
name: uses-attribute-selectors

context:
  scaffold_script: scaffold.sh

execution:
  max_turns: 10
  timeout_seconds: 900
  allowed_tools: [Skill, Read, Glob, Grep, Write, Agent]
  prompt: |
    Use the cypress-test-writer skill to write a Cypress component test for a ui5-checkbox component that toggles the checkbox and verifies the checked state changes.

graders:
  - name: attribute-selectors
    type: llm
    criteria: |
      PASS if the generated Cypress test code uses attribute selectors like [ui5-checkbox] (with square brackets) instead of tag selectors like ui5-checkbox (without brackets).
      FAIL if the code uses bare tag selectors like cy.get("ui5-checkbox") without square brackets, or if no Cypress test code is present.
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?cypress-test-writer"'
