[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "skilleval"
version = "0.1.0"
description = "Measure the effectiveness of an AI-agent skill (tokens, cost, quality) via A/B testing."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Your Name" }]
keywords = ["ai", "agent", "skill", "evaluation", "claude", "llm", "benchmark"]
dependencies = []

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]
table = ["tabulate>=0.9.0"]
sdk = ["anthropic>=0.39.0"]
all = ["pyyaml>=6.0", "tabulate>=0.9.0", "anthropic>=0.39.0"]

[project.scripts]
skilleval = "skilleval.cli:main"

[project.urls]
Homepage = "https://github.com/your-org/skill-eval"
Issues = "https://github.com/your-org/skill-eval/issues"

[tool.setuptools.packages.find]
include = ["skilleval*"]
